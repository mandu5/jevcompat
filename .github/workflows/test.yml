name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev pytest -q
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: start the reference mock
        run: |
          uv sync
          .venv/bin/jevcompat mock --port 8787 &
          for i in $(seq 30); do curl -s localhost:8787/v1/models && break; sleep 1; done
      - id: conformant
        uses: ./
        with:
          url: http://localhost:8787
          package: .
      - run: test "${{ steps.conformant.outputs.verdict }}" = conformant
      - name: start a broken mock
        run: |
          .venv/bin/jevcompat mock --port 8788 --fault choice-second &
          for i in $(seq 30); do curl -s localhost:8788/v1/models && break; sleep 1; done
      - id: broken
        uses: ./
        with:
          url: http://localhost:8788
          package: .
          fail-on-must: "false"
      - run: test "${{ steps.broken.outputs.verdict }}" = "not conformant"
      - name: stop the mocks
        if: always()
        run: pkill -f "jevcompat mock" || true
