name: jevcompat
description: Test a Jev-compatible (TypeSafe System One) server against the jevcompat spec and summarise the result.
branding:
  icon: check-square
  color: green
inputs:
  url:
    description: Root URL of the running server, e.g. http://localhost:8000
    required: true
  key:
    description: API key, if the server requires one (also enables the auth checks)
    required: false
    default: ""
  model:
    description: Model name to send
    required: false
    default: jev-latest
  package:
    description: What to install, as a uv/pip requirement or a path (e.g. "jevcompat==0.1.0", or "." in this repo's CI)
    required: false
    default: "jevcompat==0.1.0"
  fail-on-must:
    description: Fail the step when a MUST fails or the server cannot be tested (an incomplete run only warns)
    required: false
    default: "true"
outputs:
  verdict:
    description: conformant, not conformant, incomplete, not tested, or error
    value: ${{ steps.run.outputs.verdict }}
  conformant:
    description: "true if every MUST requirement passed"
    value: ${{ steps.run.outputs.conformant }}
  must:
    description: MUST requirements passed/tested, e.g. 31/33
    value: ${{ steps.run.outputs.must }}
  badge:
    description: Markdown for a README badge
    value: ${{ steps.run.outputs.badge }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false  # no post-job cache prune: it would wait on a uv process still serving the tested server
    - id: run
      shell: bash
      env:
        JEVCOMPAT_KEY: ${{ inputs.key }}
        URL: ${{ inputs.url }}
        MODEL: ${{ inputs.model }}
        PACKAGE: ${{ inputs.package }}
      run: |
        set +e
        rm -f jevcompat-report.json jevcompat-report.md
        args=(test "$URL" --model "$MODEL" --json jevcompat-report.json --markdown jevcompat-report.md)
        if [ -n "$JEVCOMPAT_KEY" ]; then args+=(--key-env JEVCOMPAT_KEY); fi
        uvx --from "$PACKAGE" jevcompat "${args[@]}"
        code=$?
        set -e
        echo "exit=$code" >> "$GITHUB_OUTPUT"
        if [ ! -s jevcompat-report.json ]; then
          echo "jevcompat did not produce a report (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          echo "conformant=false" >> "$GITHUB_OUTPUT"
          echo "verdict=error" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        cat jevcompat-report.md >> "$GITHUB_STEP_SUMMARY"
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        s = json.load(open("jevcompat-report.json"))["summary"]
        print(f"conformant={str(s['conformant']).lower()}")
        print(f"verdict={s['verdict']}")
        print(f"must={s['MUST']['passed']}/{s['MUST']['tested']}")
        badge = next((l for l in open("jevcompat-report.md") if l.startswith("[![jevcompat")), "").strip()
        print(f"badge={badge}")
        PY
    - if: steps.run.outputs.verdict == 'incomplete'
      shell: bash
      run: echo "::warning::jevcompat could not judge every MUST (MUST ${{ steps.run.outputs.must }}); see the job summary"
    - if: inputs.fail-on-must == 'true' && steps.run.outputs.verdict != 'conformant' && steps.run.outputs.verdict != 'incomplete'
      shell: bash
      run: |
        echo "::error::jevcompat verdict is ${{ steps.run.outputs.verdict }} (MUST ${{ steps.run.outputs.must }}); see the job summary"
        exit 1
